<!DOCTYPE html>
<html data-theme="dark" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Hayden 的博客 — 同步微信公众号文章，记录技术与生活。">
    <meta name="author" content="Hayden">
    <meta name="referrer" content="no-referrer">
    <link rel="canonical" href="https://jiangfengyuan.github.io/blog">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Hayden">
    <meta property="og:title" content="Blog — Hayden">
    <meta property="og:description" content="Hayden 的博客 — 同步微信公众号文章，记录技术与生活。">
    <meta property="og:url" content="https://jiangfengyuan.github.io/blog">
    <meta property="og:image" content="https://jiangfengyuan.github.io/assets/social/blog.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://jiangfengyuan.github.io/assets/social/blog.png">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">

    <title>Blog — Hayden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- 代码高亮主题：明暗两套，由 blog.js 跟随 data-theme 切换启用 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme-light" disabled>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme-dark">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-blog">
    <a class="skip-link" href="#main-content"><span class="lang-text" data-en="Skip to main content" data-zh="跳至主要内容">跳至主要内容</span></a>
    <!-- 背景粒子 canvas -->
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <!-- 阅读进度条（fixed，accent 色） -->
    <div class="reading-progress" aria-hidden="true">
        <div class="reading-progress-bar" id="reading-progress-bar"></div>
    </div>

    <!-- 导航 -->
    <nav class="navbar">
        <div class="navbar-bg"></div>
        <div class="nav-container">
            <a href="./" class="nav-logo">
                <span class="logo-bracket">&lt;</span>Hayden<span class="logo-bracket">/&gt;</span>
            </a>
            <ul class="nav-links" id="primary-navigation">
                <li><a href="./" class="nav-link"><span class="lang-text" data-en="Home" data-zh="首页">首页</span></a></li>
                <li><a href="flash" class="nav-link">Flash</a></li>
                <li><a href="republica.html" class="nav-link">Republica</a></li>
                <li><a href="dhgt" class="nav-link">DHGT</a></li>
                <li><a href="blog" class="nav-link active"><span class="lang-text" data-en="Blog" data-zh="博客">博客</span></a></li>
                <li><a href="updates" class="nav-link"><span class="lang-text" data-en="Updates" data-zh="动态">动态</span></a></li>
                <li><a href="./#contact" class="nav-link"><span class="lang-text" data-en="Contact" data-zh="联系">联系</span></a></li>
            </ul>
            <div class="nav-controls">
                <button id="lang-toggle" class="control-btn" aria-label="切换语言">EN</button>
                <button id="theme-toggle" class="control-btn" aria-label="切换主题">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </div>
            <button class="menu-toggle" aria-label="菜单" aria-controls="primary-navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main>
    <!-- 博客头部 -->
    <section class="blog-hero">
        <div class="container">
            <span class="section-tag">Blog</span>
            <h1 class="blog-title"><span class="lang-text" data-en="Writing & Notes" data-zh="文章与随笔">文章与随笔</span></h1>
            <p class="blog-subtitle">
                <span class="lang-text" data-en="Synced from my WeChat official account, plus occasional notes." data-zh="同步自我的微信公众号，也记录一些零星的想法。">同步自我的微信公众号，也记录一些零星的想法。</span>
            </p>
        </div>
    </section>

    <!-- 文章列表视图 -->
    <section id="blog-list-view" class="blog-list-section">
        <div class="container">
            <div class="blog-toolbar">
                <div class="blog-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="search" id="blog-search-input" data-zh-placeholder="搜索标题、摘要或标签…" data-en-placeholder="Search title, summary or tags…" placeholder="搜索标题、摘要或标签…" aria-label="搜索文章">
                </div>
                <div class="blog-tags" id="blog-tag-chips"></div>
            </div>
            <div class="blog-posts" id="blog-post-list"></div>
            <p class="blog-empty" id="blog-empty" hidden>
                <span class="lang-text" data-en="No posts yet — stay tuned!" data-zh="暂无文章，敬请期待～">暂无文章，敬请期待～</span>
            </p>
            <p class="blog-empty" id="blog-no-result" hidden>
                <span class="lang-text" data-en="No posts found." data-zh="没有找到文章。">没有找到文章。</span>
            </p>
        </div>
    </section>

    <!-- 文章阅读视图 -->
    <section id="blog-post-view" class="blog-post-section" hidden>
        <div class="container">
            <button class="btn btn-outline blog-back" id="blog-back-btn">
                &larr; <span class="lang-text" data-en="All posts" data-zh="返回列表">返回列表</span>
            </button>
            <article class="blog-article">
                <header class="blog-article-header">
                    <h1 class="blog-article-title" id="post-title"></h1>
                    <div class="blog-article-meta">
                        <time id="post-date"></time>
                        <span class="blog-article-stats" id="post-stats"></span>
                        <span class="blog-article-tags" id="post-tags"></span>
                    </div>
                </header>
                <nav class="post-toc" id="post-toc" aria-label="文章目录" hidden></nav>
                <div class="blog-article-content" id="post-content"></div>
                <p class="blog-article-error" id="post-error" hidden>
                    <span class="lang-text" data-en="Failed to load this post. Please refresh and try again." data-zh="文章加载失败，请刷新重试。">文章加载失败，请刷新重试。</span>
                </p>
                <nav class="post-nav" aria-label="上一篇 / 下一篇">
                    <a class="post-nav-link post-nav-prev" id="post-prev" href="#">
                        <span class="post-nav-label">&larr; <span class="lang-text" data-en="Previous" data-zh="上一篇">上一篇</span></span>
                        <span class="post-nav-title"></span>
                    </a>
                    <a class="post-nav-link post-nav-next" id="post-next" href="#">
                        <span class="post-nav-label"><span class="lang-text" data-en="Next" data-zh="下一篇">下一篇</span> &rarr;</span>
                        <span class="post-nav-title"></span>
                    </a>
                </nav>
            </article>
        </div>
    </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Designed & Built by Hayden In P.R. China <span class="heart">♥</span></p>
            <p class="footer-sub"><a href="blog-admin" class="footer-admin-link">站长投稿入口</a></p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
    <script src="posts.js"></script>
    <script src="content.js"></script>
    <script src="blog.js"></script>
    <script src="script.js"></script>
</body>
</html>
